<svg width="680" height="980" viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ClaimSense architecture</title>
<desc>The actual pipeline as implemented: receipt upload, ingest and validate, extraction (OCR first, on-device AI as fallback), category classification, then travel reconciliation and policy check running independently in parallel, merging into claim population, human review, approve and submit, export to xlsx, and manual handoff to finance outside the device. Local storage holds all data plus a SHA-256 audit log written at every step. Admin-entered policy limits feed the policy check.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<style>
text { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #2C2C2A; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; }
.arr { stroke: #444441; stroke-width: 0.5; fill: none; }
.box { stroke-width: 0.5; }
.gray { fill: #F1EFE8; stroke: #5F5E5A; }
.gray text { fill: #444441; }
.purple { fill: #EEEDFE; stroke: #534AB7; }
.purple text { fill: #3C3489; }
.teal { fill: #E1F5EE; stroke: #0F6E56; }
.teal text { fill: #085041; }
.container { fill: none; stroke: #B4B2A9; stroke-width: 0.5; stroke-dasharray: 4 4; }
</style>

<rect class="container" x="40" y="80" width="600" height="700" rx="8"/>
<text x="56" y="100" class="th">this device — zero network</text>

<rect class="box gray" x="240" y="120" width="200" height="48" rx="4"/>
<text x="340" y="140" text-anchor="middle" class="th">receipt upload</text>
<text x="340" y="158" text-anchor="middle" class="ts">by the employee</text>
<line x1="340" y1="168" x2="340" y2="190" class="arr" marker-end="url(#arrow)"/>

<rect class="box teal" x="240" y="190" width="200" height="48" rx="4"/>
<text x="340" y="210" text-anchor="middle" class="th">ingest &amp; validate</text>
<text x="340" y="228" text-anchor="middle" class="ts">hash + duplicate check</text>
<line x1="340" y1="238" x2="340" y2="260" class="arr" marker-end="url(#arrow)"/>

<rect class="box purple" x="240" y="260" width="200" height="48" rx="4"/>
<text x="340" y="280" text-anchor="middle" class="th">extraction</text>
<text x="340" y="298" text-anchor="middle" class="ts">OCR first, AI if needed</text>
<line x1="340" y1="308" x2="340" y2="330" class="arr" marker-end="url(#arrow)"/>

<rect class="box teal" x="240" y="330" width="200" height="48" rx="4"/>
<text x="340" y="350" text-anchor="middle" class="th">categorize</text>
<text x="340" y="368" text-anchor="middle" class="ts">keyword matching</text>

<line x1="340" y1="378" x2="245" y2="410" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="378" x2="435" y2="410" class="arr" marker-end="url(#arrow)"/>

<rect class="box teal" x="160" y="410" width="170" height="48" rx="4"/>
<text x="245" y="430" text-anchor="middle" class="th">travel check</text>
<text x="245" y="448" text-anchor="middle" class="ts">matches trip dates</text>

<rect class="box teal" x="350" y="410" width="170" height="48" rx="4"/>
<text x="435" y="430" text-anchor="middle" class="th">policy check</text>
<text x="435" y="448" text-anchor="middle" class="ts">vs category limits</text>

<line x1="245" y1="458" x2="340" y2="472" class="arr" marker-end="url(#arrow)"/>
<line x1="435" y1="458" x2="340" y2="472" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="472" x2="340" y2="490" class="arr" marker-end="url(#arrow)"/>

<rect class="box teal" x="240" y="490" width="200" height="48" rx="4"/>
<text x="340" y="510" text-anchor="middle" class="th">claim populator</text>
<text x="340" y="528" text-anchor="middle" class="ts">builds the claim record</text>
<line x1="340" y1="538" x2="340" y2="560" class="arr" marker-end="url(#arrow)"/>

<rect class="box gray" x="240" y="560" width="200" height="48" rx="4"/>
<text x="340" y="580" text-anchor="middle" class="th">human review</text>
<text x="340" y="598" text-anchor="middle" class="ts">a person checks it</text>
<line x1="340" y1="608" x2="340" y2="630" class="arr" marker-end="url(#arrow)"/>

<rect class="box gray" x="240" y="630" width="200" height="48" rx="4"/>
<text x="340" y="650" text-anchor="middle" class="th">approve &amp; submit</text>
<text x="340" y="668" text-anchor="middle" class="ts">explicit human action</text>
<line x1="340" y1="678" x2="340" y2="700" class="arr" marker-end="url(#arrow)"/>

<rect class="box gray" x="240" y="700" width="200" height="48" rx="4"/>
<text x="340" y="720" text-anchor="middle" class="th">export to .xlsx</text>
<text x="340" y="738" text-anchor="middle" class="ts">saved to downloads</text>

<rect class="container" x="470" y="190" width="150" height="118" rx="8"/>
<text x="545" y="240" text-anchor="middle" class="th">local storage</text>
<text x="545" y="258" text-anchor="middle" class="ts">data + audit log</text>
<line x1="440" y1="250" x2="470" y2="250" class="arr" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<rect class="box gray" x="470" y="330" width="150" height="48" rx="4"/>
<text x="545" y="350" text-anchor="middle" class="th">policy limits</text>
<text x="545" y="368" text-anchor="middle" class="ts">added by admin</text>
<line x1="500" y1="378" x2="500" y2="410" class="arr" marker-end="url(#arrow)"/>

<line x1="340" y1="748" x2="340" y2="860" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<text x="350" y="800" class="ts">manual handoff</text>
<text x="350" y="815" class="ts">(email, drive)</text>

<rect class="box gray" x="240" y="860" width="200" height="50" rx="4"/>
<text x="340" y="880" text-anchor="middle" class="th">company finance</text>
<text x="340" y="898" text-anchor="middle" class="ts">outside this app</text>

<rect x="100" y="940" width="14" height="14" rx="2" class="box gray"/>
<text x="120" y="951" class="ts">manual step</text>
<rect x="260" y="940" width="14" height="14" rx="2" class="box purple"/>
<text x="280" y="951" class="ts">on-device AI</text>
<rect x="420" y="940" width="14" height="14" rx="2" class="box teal"/>
<text x="440" y="951" class="ts">automatic check</text>
</svg>
